name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - run: npm ci

      # backend/generated is gitignored, so the Prisma client has to be built
      # before the type checker can resolve imports from it.
      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        # `prisma generate` only reads the schema, so a syntactically valid
        # placeholder is enough here.
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db
        run: npx prisma generate

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Single check to require in branch protection, so the required check doesn't
  # have to be updated whenever the matrix changes.
  lint-all:
    name: lint
    runs-on: ubuntu-latest
    needs: lint
    if: always()
    steps:
      - name: Verify all lint jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more lint jobs failed: ${{ needs.lint.result }}"
            exit 1
          fi
